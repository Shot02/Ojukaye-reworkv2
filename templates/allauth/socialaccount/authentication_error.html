{% extends 'base.html' %}
{% block title %}Sign in error{% endblock %}

{% block body %}
<div class="auth-wrap" style="min-height: calc(100vh - 60px);">
    <div class="card" style="max-width: 440px; width: 100%;">
        <div style="padding: 32px 28px; text-align: center;">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--danger-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i class="fas fa-exclamation-triangle" style="font-size: 28px; color: var(--danger);"></i>
            </div>
            <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">Sign in failed</h1>
            <p style="font-size: 13.5px; color: var(--text-2); margin-bottom: 24px; line-height: 1.6;">
                We couldn't complete your sign in. Please try again or use a different method.
            </p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">
                <i class="fas fa-arrow-left"></i> Back to sign in
            </a>
        </div>
    </div>
</div>
{% endblock %}
