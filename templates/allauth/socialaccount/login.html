{% extends 'base.html' %}
{% block title %}Sign in with Google{% endblock %}

{% block body %}
<div class="auth-wrap" style="min-height: calc(100vh - 60px);">
    <div class="card" style="max-width: 440px; width: 100%; padding: 0;">
        <div style="padding: 32px 28px; text-align: center;">

            <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
                <i class="fab fa-google" style="font-size: 28px; color: #ea4335;"></i>
            </div>

            <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">
                Continue with Google
            </h1>
            <p style="font-size: 13.5px; color: var(--text-3); margin-bottom: 24px; line-height: 1.6;">
                You're about to sign in using your Google account. You'll be asked to approve access on Google's page.
            </p>

            <form method="post" action="">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fab fa-google"></i> Continue
                </button>
            </form>

            <a href="{% url 'accounts:login' %}" class="btn btn-ghost btn-block" style="margin-top: 10px;">
                Cancel
            </a>
        </div>
    </div>
</div>
{% endblock %}
